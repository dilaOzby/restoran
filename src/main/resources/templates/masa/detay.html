<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Masa Detay - Alesta</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; gap: 20px; margin: 20px; background-color: #f4f4f4; }
        .sol-panel { flex: 2; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .sag-panel { flex: 1; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .kategori-blok { margin-bottom: 20px; }
        .urun-listesi { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
        .urun-btn { padding: 12px; background-color: #34495e; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .urun-btn:hover { background-color: #2c3e50; }
        .siparis-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #eee; }
        .toplam { font-size: 18px; font-weight: bold; margin-top: 15px; color: #2ecc71; }
        .btn { display: inline-block; width: 100%; padding: 12px; text-align: center; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-kirmizi { background-color: #e74c3c; color: white; }
        .btn-mavi { background-color: #3498db; color: white; text-decoration: none; }
        .geri-link { display: inline-block; margin-bottom: 15px; color: #3498db; text-decoration: none; }
        .iptal-btn { background: none; border: none; color: #e74c3c; font-weight: bold; cursor: pointer; padding: 0 5px; font-size: 14px; }
        .iptal-btn:hover { color: #c0392b; }
    </style>
</head>
<body>

<div class="sol-panel">
    <a href="/masalar" class="geri-link">← Ana Panele Dön</a>
    <h2 th:text="${masa.bolge} + ' - Masa ' + ${masa.masaNo} + ' Sipariş Menüsü'"></h2>

    <div th:if="${siparis == null}">
        <p>Bu masada açık bir adisyon bulunmuyor.</p>
        <form th:action="'/masalar/' + ${masa.id} + '/siparis-olustur'" method="post">
            <button class="btn btn-mavi" type="submit">Sipariş / Adisyon Aç</button>
        </form>
    </div>

    <div th:if="${siparis != null}">

        <div class="kategori-blok">
            <h3>Sıcak İçecekler</h3>
            <div class="urun-listesi">
                <th:block th:each="u : ${yemekler}" th:if="${u.kategori == 'Sıcak İçecekler'}">
                    <form th:action="'/masalar/' + ${masa.id} + '/urun-ekle'" method="post">
                        <input type="hidden" name="siparisId" th:value="${siparis.id}">
                        <input type="hidden" name="yemekId" th:value="${u.id}">
                        <button class="urun-btn" type="submit" th:text="${u.ad} + ' (' + ${u.fiyat} + ' ₺)'"></button>
                    </form>
                </th:block>
            </div>
        </div>

        <div class="kategori-blok">
            <h3>Soğuk İçecekler</h3>
            <div class="urun-listesi">
                <th:block th:each="u : ${yemekler}" th:if="${u.kategori == 'Soğuk İçecekler'}">
                    <form th:action="'/masalar/' + ${masa.id} + '/urun-ekle'" method="post">
                        <input type="hidden" name="siparisId" th:value="${siparis.id}">
                        <input type="hidden" name="yemekId" th:value="${u.id}">
                        <button class="urun-btn" type="submit" th:text="${u.ad} + ' (' + ${u.fiyat} + ' ₺)'"></button>
                    </form>
                </th:block>
            </div>
        </div>

        <div class="kategori-blok">
            <h3>Yiyecekler</h3>
            <div class="urun-listesi">
                <th:block th:each="u : ${yemekler}" th:if="${u.kategori == 'Yiyecekler'}">
                    <form th:action="'/masalar/' + ${masa.id} + '/urun-ekle'" method="post">
                        <input type="hidden" name="siparisId" th:value="${siparis.id}">
                        <input type="hidden" name="yemekId" th:value="${u.id}">
                        <button class="urun-btn" type="submit" th:text="${u.ad} + ' (' + ${u.fiyat} + ' ₺)'"></button>
                    </form>
                </th:block>
            </div>
        </div>

        <div class="kategori-blok">
            <h3>Tatlılar</h3>
            <div class="urun-listesi">
                <th:block th:each="u : ${yemekler}" th:if="${u.kategori == 'Tatlılar'}">
                    <form th:action="'/masalar/' + ${masa.id} + '/urun-ekle'" method="post">
                        <input type="hidden" name="siparisId" th:value="${siparis.id}">
                        <input type="hidden" name="yemekId" th:value="${u.id}">
                        <button class="urun-btn" type="submit" th:text="${u.ad} + ' (' + ${u.fiyat} + ' ₺)'"></button>
                    </form>
                </th:block>
            </div>
        </div>

    </div>
</div>

<div class="sag-panel">
    <h3>Adisyon Özeti</h3>

    <div th:if="${siparis == null}">
        <p>Sipariş listesi boş.</p>
    </div>

    <div th:if="${siparis != null}">
        <div class="siparis-listesi">
            <div class="siparis-item" th:each="urun : ${siparis.yemekler}">
                <span th:text="${urun.ad}"></span>
                <div>
                    <span th:text="${urun.fiyat} + ' ₺'" style="margin-right: 10px;"></span>
                    <form th:action="'/masalar/' + ${masa.id} + '/urun-sil'" method="post" style="display: inline;">
                        <input type="hidden" name="siparisId" th:value="${siparis.id}">
                        <input type="hidden" name="yemekId" th:value="${urun.id}">
                        <button type="submit" class="iptal-btn">X</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="toplam">
            Toplam: <span th:text="${siparis.toplam}">0</span> ₺
        </div>

        <form th:action="'/masalar/' + ${masa.id} + '/kapat'" method="post">
            <input type="hidden" name="siparisId" th:value="${siparis.id}"/>
            <button class="btn btn-kirmizi" type="submit">Hesabı Kapat (Masayı Boşalt)</button>
        </form>
    </div>
</div>

</body>
</html>
