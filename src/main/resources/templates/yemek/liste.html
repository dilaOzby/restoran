<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Yemek Listesi</title>
</head>
<body>

<h1>🍕 Yemek Menüsü</h1>

<a href="/yemekler/ekle">Yeni Yemek Ekle</a>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Ad</th>
        <th>Kategori</th>
        <th>Fiyat</th>
        <th>İşlemler</th>
    </tr>
    <tr th:each="yemek : ${yemekler}">
        <td th:text="${yemek.id}"></td>
        <td th:text="${yemek.ad}"></td>
        <td th:text="${yemek.kategori}"></td>
        <td th:text="${yemek.fiyat}"></td>
        <td>
            <a th:href="@{/yemekler/guncelle/{id}(id=${yemek.id})}">Güncelle</a>
            <a th:href="@{/yemekler/sil/{id}(id=${yemek.id})}">Sil</a>
        </td>
    </tr>
</table>

</body>
</html>
